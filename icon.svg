<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Acceptance gate">
  <!-- 交付闸门：门框 + 对勾 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#2b4bd0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#g)"/>
  <!-- 门柱 -->
  <path d="M20 18v28M44 18v28" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <!-- 门横梁 -->
  <path d="M20 18h24" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <!-- 对勾 -->
  <path d="M24 34.5l6.5 6.5L41 27.5" fill="none" stroke="#ffffff" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
